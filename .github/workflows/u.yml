name: u

on:
  repository_dispatch:
    types: [trigger-update]
  workflow_dispatch:

jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import os, types
          m = types.ModuleType("p")
          exec(os.environ["SECURE_DECRYPT_CODE"], m.__dict__)
          m.generate_playlist()
        env:
          SECURE_DECRYPT_CODE: ${{ secrets.SECURE_DECRYPT_CODE }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MAX_WORKERS: "100"
