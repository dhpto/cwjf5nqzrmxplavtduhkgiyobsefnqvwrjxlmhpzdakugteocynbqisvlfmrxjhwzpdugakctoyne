name: u
on:
  repository_dispatch:
    types: [trigger-update]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: '--no-deprecation'
  NODE_NO_WARNINGS: '1'

jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install beautifulsoup4 curl_cffi urllib3
        
      - name: Run script
        shell: python
        run: |
          import os, types
          m = types.ModuleType("p")
          exec(os.environ["SECURE_DECRYPT_CODE"], m.__dict__)
          m.generate_playlist()
        env:
          SECURE_DECRYPT_CODE: ${{ secrets.SECURE_DECRYPT_CODE }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MAX_WORKERS: "50"
